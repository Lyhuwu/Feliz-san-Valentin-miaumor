<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Feliz San Valentin ✨</title>
    <script src="https://unpkg.com/typewriter-effect@latest/dist/core.js"></script>
    <style>
        :root {
            --azul-brillante: #77ccff;
            --cristal: rgba(255, 255, 255, 0.1);
            --borde-cristal: rgba(255, 255, 255, 0.2);
        }

        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            margin: 0;
            padding: 0;
            background: #050a18; /* Azul muy oscuro para que resalte el cristal */
            color: white;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Fondo de partículas suaves */
        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            z-index: -1;
        }

        .container {
            width: 90%;
            max-width: 400px;
            text-align: center;
            z-index: 1;
        }

        h1 {
            font-size: 1.8rem;
            font-weight: 300;
            margin-bottom: 5px;
            letter-spacing: 2px;
        }

        #typewriter {
            font-size: 0.95rem;
            color: var(--azul-brillante);
            height: 40px; /* Espacio reservado para el texto */
            margin-bottom: 30px;
        }

        /* Contenedor de botones */
        .menu-grid {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Efecto Glassmorphism en los botones */
        .btn-glass {
            background: var(--cristal);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid var(--borde-cristal);
            border-radius: 15px;
            padding: 20px;
            text-decoration: none;
            color: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s ease;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .btn-glass span {
            font-size: 1.1rem;
            font-weight: 500;
        }

        .icon {
            font-size: 1.4rem;
        }

        /* Feedback visual al tocar en móvil */
        .btn-glass:active {
            transform: scale(0.96);
            background: rgba(255, 255, 255, 0.2);
            border-color: var(--azul-brillante);
        }

        /* Botón bloqueado (para proyectos futuros) */
        .locked {
            opacity: 0.4;
            pointer-events: none;
        }

        footer {
            margin-top: 40px;
            font-size: 0.8rem;
            opacity: 0.6;
        }
    </style>
</head>
<body>

    <canvas id="canvas-bg"></canvas>

    <div class="container">
        <h1>Sofi</h1>
        <div id="typewriter"></div>

        <nav class="menu-grid">
            <a href="URL_DE_TU_GALAXIA" class="btn-glass">
                <span>Conoce mi universo</span>
                <span class="icon">🌌</span>
            </a>

            <a href="URL_DE_TU_FORTUNA" class="btn-glass">
                <span>Descubre tu suerte</span>
                <span class="icon">🔮</span>
            </a>

            <a href="#" class="btn-glass locked">
                <span>Nuestras Cartas</span>
                <span class="icon">✉️</span>
            </a>
        </nav>

        <footer>Hecho con ❤️ por ti</footer>
    </div>

    <script>
        // Configuración de la máquina de escribir
        const app = document.getElementById('typewriter');
        const typewriter = new Typewriter(app, {
            loop: true,
            delay: 50,
        });

        typewriter
            .typeString('Bienvenida a tus universos personales.')
            .pauseFor(2000)
            .deleteAll()
            .typeString('¿Qué quieres explorar hoy?')
            .pauseFor(2500)
            .start();

        // Fondo de estrellas animado (ligero para móvil)
        const canvas = document.getElementById('canvas-bg');
        const ctx = canvas.getContext('2d');
        let particles = [];

        function init() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
            particles = [];
            for (let i = 0; i < 60; i++) {
                particles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 1.5,
                    speed: Math.random() * 0.3
                });
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = 'rgba(255, 255, 255, 0.5)';
            particles.forEach(p => {
                ctx.beginPath();
                ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                ctx.fill();
                p.y -= p.speed;
                if (p.y < 0) p.y = canvas.height;
            });
            requestAnimationFrame(draw);
        }

        window.addEventListener('resize', init);
        init();
        draw();
    </script>
</body>
</html>
